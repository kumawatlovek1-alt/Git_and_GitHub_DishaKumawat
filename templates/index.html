
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>My To-Do App</h1>

        <form id="todoForm">
            <label for="itemName">Item Name:</label>
            <input
                type="text"
                id="itemName"
                name="itemName"
                placeholder="Enter item name"
                required
            >

            <label for="itemDescription">Item Description:</label>
            <textarea
                id="itemDescription"
                name="itemDescription"
                placeholder="Enter item description"
                required
            ></textarea>

            <button type="submit">Submit Item</button>
        </form>

        <hr>

        <h2>Submitted Item Details</h2>
        <p><strong>Item ID:</strong> <span id="itemId">Not generated</span></p>
        <p><strong>Item UUID:</strong> <span id="itemUUID">Not generated</span></p>
        <p><strong>Item Hash:</strong> <span id="itemHash">Not generated</span></p>

        <p id="message"></p>

        <hr>

        <button onclick="getData()">Get API Data</button>
        <pre id="result"></pre>
    </div>

    <script>
        document.getElementById("todoForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const formData = new FormData(this);

            try {
                const response = await fetch("/submittodoitem", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    document.getElementById("message").textContent = data.error;
                    return;
                }

                document.getElementById("itemId").textContent = data.item_id;
                document.getElementById("itemUUID").textContent = data.itemUUID;
                document.getElementById("itemHash").textContent = data.itemHash;
                document.getElementById("message").textContent = data.message;

                this.reset();

            } catch (error) {
                document.getElementById("message").textContent =
                    "Error submitting item. Please try again.";
            }
        });

        async function getData() {
            const response = await fetch("/api");
            const data = await response.json();

            document.getElementById("result").textContent =
                JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
